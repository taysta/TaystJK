# Grouped cards on the section hub pages, rendered by _includes/browse-grid.html.
# The header tabs are not here; they are hardcoded in _layouts/reference.html.
#
# Keep each hub's card order the same as its pages' `nav_order`, so the hub and the
# previous/next links at the foot of each page walk the section in one order.

sections:
  install:
    groups:
      - title: More in this section
        description: Details that decide what your installation can do.
        items:
          - title: Platform support
            url: /install/platform-support/
            description: Features whose availability depends on your operating system or processor.
            cta: Platform differences
          - title: Builds and versioning
            url: /install/builds-and-versioning/
            description: How releases are identified, and how to tell whether your build has a feature.
            cta: Read your build
          - title: Mod compatibility
            url: /install/mod-compatibility/
            description: Why a client feature works on one server and silently does nothing on another.
            cta: Server differences
  server-hosting:
    groups:
      - title: The dedicated server
        description: The TaystJK server engine, whichever game module it loads.
        items:
          - title: Run a server
            url: /server-hosting/run-a-server/
            description: Docker Compose, a native binary, or another mod's game module, and the checks to run before going public.
            cta: Start a server
          - title: Downloads and PK3 references
            url: /server-hosting/downloads/
            description: HTTP and UDP downloads, reflists, and running a pure server.
            cta: Serve files
          - title: Server-side demos
            url: /server-hosting/demos/
            description: Recording demos on the server, on demand or retroactively.
            cta: Record demos
      - title: The jaPRO game module
        description: TaystJK's bundled jampgame in the taystjk directory.
        items:
          - title: jaPRO server setup
            url: /server-hosting/japro-setup/
            description: Accounts, admins, clans, voting, bans, and the commands that tweak gameplay.
            cta: Set up jaPRO
          - title: Bundled server configs
            url: /server-hosting/bundled-configs/
            description: The Docker image's server.cfg, game modes and vote options.
            cta: Game modes
      - title: Configuration tools
        description: For the jaPRO module, base game rules or another mod.
        items:
          - title: Server config generator
            url: /server-hosting/config-generator/
            description: Build a server.cfg, a gameplay baseline, game modes and vote options in your browser.
            cta: Generate configs
  features:
    groups:
      - title: Coming from another client
        description: Compare TaystJK with the client you already know.
        items:
          - title: What's new
            url: /features/whats-new/
            description: Every cvar and command this fork adds, filtered by the client you are coming from.
            cta: Generated comparison
      - title: Interface and customization
        description: Change how the client looks, presents information, and behaves in everyday use.
        items:
          - title: Client behaviour
            url: /features/client-behaviour/
            description: Shader overrides, modifier binds, console editing, and widescreen assets.
            cta: Behaviour changes
          - title: HUD and movement tools
            url: /features/hud-and-movement/
            description: Killfeed, team overlays, SnapHUD, PitchHUD, strafe helper, and speedometer.
            cta: HUD tools
          - title: Cosmetics
            url: /features/cosmetics/
            description: Hats and capes, how to add one, and the offsets format that positions it.
            cta: Cosmetics guide
          - title: Chat emoji
            url: /features/emoji/
            description: Every emoji the client ships, and the text you type to send it.
            cta: Emoji index
          - title: Renderers
            url: /features/renderers/
            description: What each backend is for, how to switch, and where to report a renderer bug.
            cta: Renderer guide
      - title: Gameplay modes
        description: Movement and game modes that depend on the server you join.
        items:
          - title: Movement styles
            url: /features/movement-styles/
            description: The movement styles a server can run, and how each one plays.
            cta: Movement styles
          - title: Racing on jaPRO
            url: /features/racing/
            description: Racemode, practice, accounts and leaderboards, HUD setup, and strafe trails.
            cta: Racing guide
          - title: Tribes
            url: /features/tribes/
            description: Skiing, jetpacks, classes and packs. Experimental and lightly played.
            cta: Tribes mode
      - title: Configuration and scripting
        description: Work with the files and scripting tools that configure the client.
        items:
          - title: Shipped configs
            url: /features/shipped-configs/
            description: The configuration files that ship with the client and what each one sets up.
            cta: Config presets
          - title: Console scripting
            url: /features/console-scripting/
            description: Nested quotes, conditional commands, cvar substitution, and command timers.
            cta: Scripting guide
  development:
    groups:
      - title: Build and debug
        description: Get a working build and step through it.
        items:
          - title: Compiling
            url: /development/compiling/
            description: Install prerequisites, choose targets and diagnostics, then build and install on Windows, Linux, or macOS.
            cta: Compilation guide
          - title: Debugging
            url: /development/debugging/
            description: Launch with the right working directory, debug engine and module code, capture logs, and use sanitizers.
            cta: Debugging guide
          - title: Libraries and versions
            url: /development/libraries/
            description: The versions of bundled dependencies, and when CMake selects system libraries instead.
            cta: Library inventory
      - title: Extend and contribute
        description: Add features that other mods and players can rely on.
        items:
          - title: Feature flags
            url: /development/feature-flags/
            description: Advertise the optional client-side features your game module supports, without being detected as JA+ or jaPRO.
            cta: taystJKinfo spec
          - title: Contributing
            url: /development/contributing/
            description: Which branch to target, what CI builds, and how to test a fix from a PR artifact without compiling it yourself.
            cta: Contributing guide
          - title: In-game documentation
            url: /development/xdocs/
            description: How a cvar documents itself inside the client, and how that relates to its registration description.
            cta: xdocs guide
      - title: Background
        description: Where the code came from, and how this site is produced.
        items:
          - title: Code lineage
            url: /reference/sources/
            description: How TaystJK relates to OpenJK, EternalJK, jaPRO, JK2MV, NewJK, rend2, and the Vulkan work. Part of the console reference.
            cta: Source methodology
          - title: How this site is built
            url: /development/documentation-system/
            description: The pipeline that generates the console reference, what is generated versus hand-written, and how to add a page.
            cta: Documentation system
  help:
    groups:
      - title: Solve a problem
        description: Start with the symptom, then work out which project owns the behaviour.
        items:
          - title: Troubleshooting
            url: /troubleshooting/
            description: Fixes for the problems players and server administrators hit most often.
            cta: Troubleshooting guide
          - title: Where to report
            url: /where-to-report/
            description: Decide whether a problem belongs to TaystJK, a game module, or a renderer.
            cta: Find the right project
      - title: Understand the documentation
        description: Learn how the site is organized and look up unfamiliar terminology.
        items:
          - title: Documentation overview
            url: /overview/
            description: How the handwritten guides and generated console reference fit together.
            cta: How this site works
          - title: Glossary
            url: /glossary/
            description: Terms used throughout the guides and console reference.
            cta: Browse definitions
      - title: Project information
        description: The project's licence, attribution, and disclosure.
        items:
          - title: Licensing and attribution
            url: /licensing/
            description: The licence, upstream projects, and requirements for reuse.
            cta: Licensing details
          - title: AI disclosure
            url: /ai-disclosure/
            description: How AI-assisted tools have been used in this documentation.
            cta: Read the disclosure
