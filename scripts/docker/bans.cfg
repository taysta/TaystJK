// IP bans. Separate addresses with spaces and end the list with a space.
// Leave off trailing numbers to ban a range: "1.2.3 " bans every 1.2.3.x address.
// While g_banIPs stays commented out, bans added with the addip command are saved and kept.
// Uncommenting it replaces that saved list at every start, so copy any addip bans into it first.
//seta g_banIPs ""

// 1 = block the listed addresses, 0 = only allow the listed addresses
seta g_filterBan 1
