// Vote options. Players run these with /callvote vstr <name>.

// Modes
set default "exec default"
set pickups "exec pickups"
set nopickups "exec nopickups"
set noboons "exec noboons"
set saberonly "exec saberonly"
set fftffa "exec fftffa"
set instagib "exec instagib"
set airshot "exec airshot"
set instagibrabbit "exec instagibrabbit"
set jk2 "exec jk2"
set jk2104 "exec jk2104"
set merc "exec merc"
set lugorff "exec lugorff"
set prize "exec prize"
set tribes "exec tribes"
set saberctf "exec saberctf"
set theone "exec theone"
set gungame "exec gungame"
set teamgungame "exec gungame;gametype 6;g_friendlyfire 0"
set wswrabbit "exec wswrabbit"
set saberrabbit "exec saberrabbit"
set predator "exec predator"
set predator2 "exec predator2"
set tribesctf "exec tribesctf"
set tribes1flag "exec tribes1flag"
set midair "exec midair"
set restart "map_restart"

// Frag and capture limits
set 0 "fraglimit 0"
set 10 "fraglimit 10"
set 21 "fraglimit 21"
set 31 "fraglimit 31"
set 41 "fraglimit 41"
set 51 "fraglimit 51"
set 61 "fraglimit 61"
set frag0 "fraglimit 0"
set frag10 "fraglimit 10"
set frag21 "fraglimit 21"
set frag31 "fraglimit 31"
set frag41 "fraglimit 41"
set cap0 "capturelimit 0"
set cap3 "capturelimit 3"
set cap5 "capturelimit 5"
set cap7 "capturelimit 7"

// Team size
set 0v0 "sv_maxTeamSize 0"
set 1v1 "sv_maxTeamSize 1"
set 2v2 "sv_maxTeamSize 2"
set 3v3 "sv_maxTeamSize 3"
set 4v4 "sv_maxTeamSize 4"
set 5v5 "sv_maxTeamSize 5"
set 6v6 "sv_maxTeamSize 6"

// Gametypes
set ffa "gametype 0"
set tffa "gametype 6"
set ctf "gametype 8"
set 1flagctf "gametype 8;g_neutralFlag 6"

// Movement styles
set jka "g_movementStyle 1"
set qw "g_movementStyle 2"
set cpm "g_movementStyle 3"
set q3 "g_movementStyle 4"
set pjk "g_movementStyle 5"
set wsw "g_movementStyle 6"
set sp "g_movementStyle 12"
set slick "g_movementStyle 13"
set ocpm "g_movementStyle 16"

// Rabbit
set rabbit "g_neutralFlag 1;g_allowGrapple 0"
set bkrabbit "g_neutralFlag 3;g_allowGrapple 0"
set norabbit "g_neutralFlag 0"

// Loadout
set noguns "g_startingWeapons 8; g_weaponDisable 524279"
set guns "g_startingWeapons 28; g_weaponDisable 0"
set all "g_startingWeapons 131070;g_startingItems 7612;g_tweakWeapons 1083928043"
// Each flips one starting item and keeps the rest; a second vote flips it back
set togglefullhp "startingitems 15"
set togglejetpack "startingitems 7"

// Toggles
set friendlyfire "g_friendlyfire 0.5"
set nofriendlyfire "g_friendlyfire 0"
set flagthrow "g_allowFlagThrow 1"
set noflagthrow "g_allowFlagThrow 0"
set fixflagsuicide "g_fixFlagSuicide 1"
set nofixflagsuicide "g_fixFlagSuicide 0"
set damagenumbers "g_damageNumbers 2"
set nodamagenumbers "g_damageNumbers 7"
set fastregen "g_forceRegenTime 33"
set race "g_racemode 2"
set splat "g_maxFallDmg 0"
set nosplat "g_maxFalldmg 50"

// Bots
set kickbots "kick allplayingbots"
