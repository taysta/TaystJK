// Server Config
seta sv_hostname "Sample TaystJK server"
//seta g_motd "woot"

// Passwords. Leave empty to disable rcon or that admin login.
// Keep rconpassword here as a "set" line: docker stop reads it to shut the server down cleanly.
set rconpassword ""
seta g_fullAdminPass ""
seta g_juniorAdminPass ""

seta sv_maxclients 16
set timelimit 0

// Downloads: HTTP for clients that support it, UDP for the rest
// HTTP port must match the one published in docker-compose.yml
seta sv_allowDownload 1
seta sv_httpDownloads 1
seta sv_httpServerPort 18200

// Network
seta sv_fps 40
seta sv_snapsmax 125
seta sv_maxRate 90000
seta sv_ratePolicy 2
seta sv_maxPing 0
seta sv_timeout 240
seta sv_floodProtect 500
seta sv_newfloodProtect 2
seta sv_reconnectlimit 10
seta sv_pure 0
seta sv_keywords "Jedi Academy"
seta sv_hibernateTime 60000
seta sv_hibernateFPS 2

// Connection security and player policy
seta g_antiFakePlayer 1
seta g_maxConnPerIP 32
seta g_securityLog 2
seta g_userinfoValidate 0
seta g_allowSamePlayerNames 0
seta g_inactivity 0
seta g_timeouttospec 60
seta g_autoMapCycle 0
seta sv_pluginKey 0
// Quit after this many days on one map with no players; Docker starts it again
seta g_autoQuit 0

// IP bans
exec bans

// Vote options for /callvote vstr
exec votes

// Bots
seta bot_minplayers 0
seta bot_maxbots 4
seta bot_team 1

// Voting (which votes are allowed is set per mode by g_allowvote)
seta g_allowTeamVote 0
seta g_voteDelay 60000
seta g_voteTimeout 300
seta g_tweakVote 2047

// Admins
seta g_fullAdminLevel 7340031
seta g_juniorAdminLevel 4428032
seta g_fullAdminMsg ""
seta g_juniorAdminMsg "as a Junior Admin"
seta g_consoleMotd ""
seta g_centerMOTD ""
seta g_centerMOTDTime 10
seta g_pauseTime 600
seta g_unpauseTime 5

// Accounts and duel rankings
seta g_allowRegistration 3
seta g_eloRanking 1
seta g_eloNewUserCutoff -1
seta g_eloProvisionalCutoff 10
seta g_eloProvisionalChangeBig 2
seta g_eloProvisionalChangeSmall 1.5
seta g_eloMinimumDuels 20
seta g_eloKValue1 25
seta g_eloKValue2 25
seta g_eloKValue3 25

// Logging (run.sh already saves console output to taystjk_server.log)
set developer 0
seta logfile 0
seta g_log "games.log"
seta g_logSync 0
seta g_statLog 0
seta g_statLogFile "statlog.log"
seta g_duelLog 2
seta g_raceLog 2
seta g_playerLog 1

// Server-side demos (sv_autoDemo 2 records through a spectating bot named RECORDER)
seta sv_autoDemo 0
seta sv_autoDemoMaxMaps 50
seta sv_autoRaceDemo 1
seta sv_demoPreRecord 0
seta sv_demoPreRecordBots 0
seta sv_demoPreRecordTime 15
seta sv_demoPreRecordKeyframeDistance 5
seta sv_demoWriteMeta 0

// Start from the gameplay baseline so settings saved by the last mode do not carry over
exec default

// gametypes
// 0 = FFA
// 3 = DUEL one on one tournament
// 4 = POWER DUEL
// 6 = TEAM DEATHMATCH
// 7 = SIEGE
// 8 = CTF
seta g_gametype 0

// start the server
map mp/ffa3
