# No theme. Every layout this site uses lives in _layouts/ -- `reference` for every
# page, `none` for raw output such as the redirect stubs and search-index.json.
# Navigation is hardcoded in _layouts/reference.html, and search is built from
# search-index.json by assets/js/site-search.js.

title: TaystJK
description: Documentation for the TaystJK Jedi Academy multiplayer client and dedicated server
baseurl: "/TaystJK" # the subpath of your site, e.g. /blog
url: "https://taysta.github.io" # the base hostname & protocol for your site, e.g. http://example.com
show_wip_banner: true

permalink: pretty
exclude: ["node_modules/", "*.gemspec", "*.gem", "Gemfile", "Gemfile.lock", "package.json", "package-lock.json", "script/", "tools/", ".cvar-audit/", "LICENSE.txt", "lib/", "bin/", "README.md", "CONVENTIONS.md", "CLAUDE.md", "Rakefile", "docs/tests/"]

# The former hand-written topic pages remain reachable through old links, but
# the generated exhaustive reference is now the canonical navigation/search
# surface. Keeping the legacy pages out of both prevents conflicting advice.
defaults:
  - scope:
      path: ""
    values:
      layout: reference
  - scope:
      path: "cvars"
    values:
      nav_exclude: true
      search_exclude: true
  - scope:
      path: "commands"
    values:
      nav_exclude: true
      search_exclude: true

# Regression tests
# By default, the pages in /docs/tests are excluded when the ste is built.
# To include them, comment-out the relevant line above.
# Uncommenting the following line doesn't work - see https://github.com/jekyll/jekyll/issues/4791
# include: ["docs/tests/"]

# The custom layout uses shared/icons/TaystJK.ico for its favicon and branding.

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
