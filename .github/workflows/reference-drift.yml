name: Console reference drift

on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  # No `schedule:` here, deliberately. GitHub only runs scheduled workflows from the
  # repository's default branch, which is `master`; a cron in a workflow that exists only
  # on `gh-pages` would never fire. The weekly run lives on `master` instead, in
  # `weekly-reference-check.yml`, and checks this branch out to run the same script.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source branch
        run: git fetch origin master:refs/remotes/origin/master
      - name: Run every check
        run: tools/cvar_audit/run_all.sh --ref origin/master
      - name: Check changelog coverage
        run: >-
          python3 tools/cvar_audit/changelog_coverage.py
          --ref origin/master --json changelog-coverage.json
      - name: Upload changelog coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changelog-coverage
          path: changelog-coverage.json
          if-no-files-found: ignore

  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build
