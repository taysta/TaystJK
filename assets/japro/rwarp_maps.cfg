# Runtime warp map policy.
#
# Used by /rwarp before any runtime BSP load.
# g_rwarpMapPolicy controls enforcement:
#   0 = disabled
#   1 = allow all maps except deny rules
#   2 = require an allow rule; deny rules still override
#
# Map names are normalized. Do not include maps/ or .bsp.
# Wildcards are supported: * ?
#
# Examples:
# deny t2_rogue
# deny mp/siege_*
# deny huge_test_map
#
# allow race/*
# allow mp/ffa1
